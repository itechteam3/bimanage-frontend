name: CI

# Typecheck, test and build. Deployment is handled by Vercel (production on
# main, previews on pull requests) — this workflow does not deploy.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://bimanage-backend.onrender.com/api' }}
      VITE_SOCKET_URL: ${{ vars.VITE_SOCKET_URL || 'https://bimanage-backend.onrender.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run tokens
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
